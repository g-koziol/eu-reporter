@if (open) {
  <div class="modal" (click)="closed.emit()">
    <div class="modal-panel" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
      <div class="modal-head"><div><div class="small">Masowe dodawanie wpisów</div><h3>Dodaj wpisy dla {{ currentMonth }}</h3></div><button type="button" aria-label="Zamknij" (click)="closed.emit()">✕</button></div>
      <div class="row2">
        <label>Typ wpisu pracy<select [(ngModel)]="workType" (ngModelChange)="typeChanged()">@for (type of config.workTypes; track type.id) { <option [value]="type.id">{{ type.name }}</option> }</select></label>
        <label>Rozdzielczość czasu<select [(ngModel)]="resolution"><option value="minute">Minuty</option><option value="30m">30 minut</option><option value="hour">Godziny</option></select></label>
      </div>
      <div class="row2"><label>Początek pracy<input type="time" [(ngModel)]="workFrom" [step]="step()"></label><label>Koniec pracy<input type="time" [(ngModel)]="workTo" [step]="step()"></label></div>
      <label>Opis działania<textarea [(ngModel)]="description"></textarea></label>
      <label>Uwagi do działania<textarea [(ngModel)]="notes"></textarea></label>
      <div><div class="small">Dodaj wpis w dniach tygodnia</div><div class="weekday-grid">@for (name of weekdays; track $index; let index = $index) { <label><input type="checkbox" [checked]="selectedWeekdays.includes(index)" (change)="toggleWeekday(index, $any($event.target).checked)"><span>{{ name }}</span></label> }</div></div>
      <div class="small">Dni do uzupełnienia: {{ daysCount }}</div>
      <div class="modal-actions"><button type="button" (click)="closed.emit()">Anuluj</button><button type="button" class="primary" (click)="submit()">Dodaj wpisy</button></div>
    </div>
  </div>
}
