<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ewidencja działań projektowych</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #fff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #dbe1ea;
      --accent: #2563eb;
      --danger: #b91c1c;
      --ok: #15803d;
      --warn: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      padding: 12px;
    }
    .wrap { max-width: 1500px; margin: auto; }
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    button, .btn, input, select, textarea { font: inherit; }
    button, .btn {
      border: 1px solid var(--line);
      background: white;
      border-radius: 8px;
      padding: 8px 11px;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.danger { color: var(--danger); }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: white;
    }
    textarea { min-height: 72px; resize: vertical; }
    .stats { display: grid; grid-template-columns: repeat(3,minmax(120px,1fr)); gap: 8px; margin-top: 10px; }
    .stat { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
    .stat b { display: block; font-size: 1.2rem; }
    .weeks { padding: 14px 0 40px; }
    .week { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 10px; margin-bottom: 10px; }
    .day { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; }
    .day.off { opacity: .45; }
    .day-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); background: #fbfcfe; }
    .day-title { font-weight: 700; }
    .day-total { font-size: .9rem; color: var(--muted); }
    .day-body { padding: 10px; display: grid; gap: 8px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    label { font-size: .82rem; color: var(--muted); display: grid; gap: 4px; }
    details { border: 1px solid var(--line); border-radius: 9px; background: #fff; }
    summary { padding: 9px; cursor: pointer; font-weight: 600; }
    .actions { padding: 0 9px 9px; display: grid; gap: 8px; }
    .action { border: 1px dashed var(--line); border-radius: 8px; padding: 8px; display: grid; gap: 7px; }
    .action-top { display: grid; grid-template-columns: 1.4fr .8fr .8fr auto; gap: 6px; align-items: end; }
    .small { font-size: .8rem; color: var(--muted); }
    .progress { height: 10px; border-radius: 999px; background: #e5e7eb; overflow: hidden; margin-top: 8px; }
    .progress > div { height: 100%; background: var(--accent); width: 0; }
    .limit-over .progress > div { background: var(--danger); }
    .limit-over #totalHours { color: var(--danger); }
    .hidden { display: none !important; }
    .footer-note { font-size: .84rem; color: var(--muted); padding: 4px 0; }
    @media (max-width:1100px){ .week { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media (max-width:700px){
      header { position: static; }
      .week { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
      .action-top, .row2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="toolbar">
        <strong id="appTitle">Ewidencja działań projektowych</strong>
        <label style="width:auto"><span id="monthLabelText">Miesiąc</span>
          <input id="monthPicker" type="month" style="width:auto">
        </label>
        <label style="width:auto"><span id="profileLabelText">Profil</span>
          <select id="profileSelect" style="width:auto"></select>
        </label>
        <label style="width:auto"><span id="projectLabelText">Projekt</span>
          <select id="projectSelect" style="width:auto"></select>
        </label>
        <button id="configBtn" class="primary" type="button">Konfiguracja</button>
        <button id="exportBtn" type="button">Eksport JSON</button>
        <label class="btn"><span id="importLabelText">Import JSON</span>
          <input id="importInput" type="file" accept="application/json,.json" class="hidden">
        </label>
        <button id="clearBtn" class="danger" type="button">Wyczyść bieżący miesiąc</button>
      </div>
      <div id="limitBox">
        <div class="stats">
          <div class="stat">Wypracowano <b id="totalHours">0:00 h</b></div>
          <div class="stat">Pozostało do 100 h <b id="remainingHours">100:00 h</b></div>
          <div class="stat">Liczba działań <b id="actionCount">0</b></div>
        </div>
        <div class="progress"><div id="progressBar"></div></div>
      </div>
      <div class="footer-note">Dane zapisują się automatycznie w tej przeglądarce. Eksport JSON służy jako kopia zapasowa i do przenoszenia danych.</div>
    </div>
  </header>

  <main class="wrap weeks" id="calendar"></main>

  <script>
    (() => {
      const LIMIT_MIN = 100 * 60;
      const STORAGE_KEY = "ewidencjaProjektowa_v1";
      const DEFAULT_RESOLUTION = "minute";
      const DEFAULT_WORK_FROM = "09:00";
      const DEFAULT_WORK_TO = "17:00";
      const DEFAULT_VERSION = 1;

      const $ = (selector) => document.querySelector(selector);
      const pad = (n) => String(n).padStart(2, "0");
      const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const ym = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
      const clone = (value) => JSON.parse(JSON.stringify(value));

      function uid(prefix) {
        return `${prefix}-${Math.random().toString(36).slice(2, 10)}-${Date.now().toString(36)}`;
      }

      function esc(value = "") {
        return String(value).replace(/[&<>"']/g, (char) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[char]));
      }

      function defaultWorkTypes() {
        return [
          {
            id: "ops-cooperation",
            name: "Współpraca z OPS",
            defaultValues: { description: "", notes: "", attrs: {} },
            attributes: []
          },
          {
            id: "institution-contact",
            name: "Kontakt z instytucją",
            defaultValues: { description: "", notes: "", attrs: {} },
            attributes: []
          },
          {
            id: "intervention",
            name: "Działania interwencyjne",
            defaultValues: { description: "", notes: "", attrs: {} },
            attributes: []
          },
          {
            id: "admin",
            name: "Praca administracyjno-organizacyjna",
            defaultValues: { description: "", notes: "", attrs: {} },
            attributes: []
          },
          {
            id: "other",
            name: "Inne",
            defaultValues: { description: "", notes: "", attrs: {} },
            attributes: []
          }
        ];
      }

      function defaultDayFields() {
        return [
          { id: "area", label: "Obszar działania", type: "textarea", defaultValue: "" },
          { id: "nextPlan", label: "Plan dalszych działań", type: "textarea", defaultValue: "" },
          { id: "risks", label: "Trudności / ryzyka", type: "textarea", defaultValue: "" },
          { id: "notes", label: "Uwagi do dnia", type: "textarea", defaultValue: "" }
        ];
      }

      function createProfile(name = "Domyślny profil") {
        return {
          id: uid("profile"),
          name,
          config: {
            timeResolution: DEFAULT_RESOLUTION,
            workFrom: DEFAULT_WORK_FROM,
            workTo: DEFAULT_WORK_TO,
            workTypes: clone(defaultWorkTypes()),
            dayFields: clone(defaultDayFields())
          }
        };
      }

      function createProject(name = "Domyślny projekt") {
        return {
          id: uid("project"),
          name,
          config: {
            timeResolution: DEFAULT_RESOLUTION,
            workFrom: DEFAULT_WORK_FROM,
            workTo: DEFAULT_WORK_TO,
            workTypes: clone(defaultWorkTypes()),
            dayFields: clone(defaultDayFields())
          }
        };
      }

      function createDefaultLabels() {
        return {
          title: "Ewidencja działań projektowych",
          month: "Miesiąc",
          profile: "Profil",
          project: "Projekt",
          config: "Konfiguracja",
          backToCalendar: "Powrót do kalendarza",
          exportJson: "Eksport JSON",
          importJson: "Import JSON",
          clearMonth: "Wyczyść bieżący miesiąc",
          globalSettings: "Ustawienia globalne",
          profileSettings: "Profile",
          projectSettings: "Projekty",
          defaultProfile: "Domyślny profil",
          defaultProject: "Domyślny projekt",
          timeResolution: "Rozdzielczość czasu",
          addProfile: "+ Dodaj profil",
          addProject: "+ Dodaj projekt",
          addWorkType: "+ Dodaj typ wpisu",
          addDayField: "+ Dodaj pole dnia",
          addAttribute: "+ Dodaj atrybut",
          labelSectionTitle: "Teksty i etykiety",
          labelHints: "Ustaw etykiety widocznych sekcji, nagłówków i przycisków.",
          workTypeLabel: "Typ wpisu pracy",
          workTypeDefaultDescription: "Domyślny opis",
          workTypeDefaultNotes: "Domyślne uwagi",
          workTypeAttributes: "Atrybuty typu",
          dayFieldLabel: "Etykieta pola",
          startOfDay: "Zakres dnia od",
          endOfDay: "Zakres dnia do",
          dayArea: "Obszar działania",
          dayPlan: "Plan dalszych działań",
          dayRisks: "Trudności / ryzyka",
          dayNotes: "Uwagi do dnia",
          actionSummary: "Działania w ciągu dnia",
          actionDescription: "Opis działania",
          actionNotes: "Uwagi do działania",
          actionDuration: "Czas działania",
          actionDelete: "Usuń",
          emptyMonth: "Poza wybranym miesiącem",
          defaultActionType: "Typ zapisu"
        };
      }

      function createDefaultConfig() {
        const profile = createProfile();
        const project = createProject();
        return {
          version: DEFAULT_VERSION,
          labels: createDefaultLabels(),
          global: {
            timeResolution: DEFAULT_RESOLUTION,
            workFrom: DEFAULT_WORK_FROM,
            workTo: DEFAULT_WORK_TO,
            workTypes: clone(defaultWorkTypes()),
            dayFields: clone(defaultDayFields())
          },
          profiles: [profile],
          projects: [project],
          defaultProfileId: profile.id,
          defaultProjectId: project.id
        };
      }

      function normalizeWorkType(item) {
        if (!item || typeof item !== "object") return null;
        const attrs = Array.isArray(item.attributes) ? item.attributes.map((attr) => ({
          id: attr && attr.id ? String(attr.id) : uid("attr"),
          label: (attr && attr.label) || (attr && attr.name) || "Nowy atrybut",
          name: (attr && attr.name) || (attr && attr.label) || "Nowy atrybut",
          type: "textarea",
          defaultValue: (attr && attr.defaultValue) || ""
        })) : [];
        return {
          id: item.id || uid("worktype"),
          name: item.name || "Nowy typ",
          defaultValues: {
            description: ((item.defaultValues && item.defaultValues.description) || ""),
            notes: ((item.defaultValues && item.defaultValues.notes) || ""),
            attrs: Object.assign({}, item.defaultValues && item.defaultValues.attrs)
          },
          attributes: attrs
        };
      }

      function normalizeDayField(item) {
        if (!item || typeof item !== "object") return null;
        return {
          id: item.id || uid("field"),
          label: item.label || item.name || "Nowe pole",
          type: "textarea",
          defaultValue: item.defaultValue || ""
        };
      }

      function normalizeConfig(raw) {
        const source = raw && typeof raw === "object" ? raw : createDefaultConfig();
        const defaultLabels = createDefaultLabels();
        const config = {
          version: DEFAULT_VERSION,
          labels: Object.assign({}, defaultLabels, source.labels || {}),
          global: {
            timeResolution: source.global && source.global.timeResolution ? source.global.timeResolution : DEFAULT_RESOLUTION,
            workFrom: source.global && source.global.workFrom ? source.global.workFrom : DEFAULT_WORK_FROM,
            workTo: source.global && source.global.workTo ? source.global.workTo : DEFAULT_WORK_TO,
            workTypes: Array.isArray(source.global && source.global.workTypes) ? source.global.workTypes.map(normalizeWorkType).filter(Boolean) : clone(defaultWorkTypes()),
            dayFields: Array.isArray(source.global && source.global.dayFields) ? source.global.dayFields.map(normalizeDayField).filter(Boolean) : clone(defaultDayFields())
          },
          profiles: Array.isArray(source.profiles) ? source.profiles.map((profile) => ({
            id: profile.id || uid("profile"),
            name: profile.name || "Nowy profil",
            config: {
              timeResolution: profile.config && profile.config.timeResolution ? profile.config.timeResolution : DEFAULT_RESOLUTION,
              workFrom: profile.config && profile.config.workFrom ? profile.config.workFrom : DEFAULT_WORK_FROM,
              workTo: profile.config && profile.config.workTo ? profile.config.workTo : DEFAULT_WORK_TO,
              workTypes: Array.isArray(profile.config && profile.config.workTypes) ? profile.config.workTypes.map(normalizeWorkType).filter(Boolean) : clone(defaultWorkTypes()),
              dayFields: Array.isArray(profile.config && profile.config.dayFields) ? profile.config.dayFields.map(normalizeDayField).filter(Boolean) : clone(defaultDayFields())
            }
          })) : [createProfile()],
          projects: Array.isArray(source.projects) ? source.projects.map((project) => ({
            id: project.id || uid("project"),
            name: project.name || "Nowy projekt",
            config: {
              timeResolution: project.config && project.config.timeResolution ? project.config.timeResolution : DEFAULT_RESOLUTION,
              workFrom: project.config && project.config.workFrom ? project.config.workFrom : DEFAULT_WORK_FROM,
              workTo: project.config && project.config.workTo ? project.config.workTo : DEFAULT_WORK_TO,
              workTypes: Array.isArray(project.config && project.config.workTypes) ? project.config.workTypes.map(normalizeWorkType).filter(Boolean) : clone(defaultWorkTypes()),
              dayFields: Array.isArray(project.config && project.config.dayFields) ? project.config.dayFields.map(normalizeDayField).filter(Boolean) : clone(defaultDayFields())
            }
          })) : [createProject()],
          defaultProfileId: source.defaultProfileId || (source.profiles && source.profiles[0] && source.profiles[0].id) || null,
          defaultProjectId: source.defaultProjectId || (source.projects && source.projects[0] && source.projects[0].id) || null
        };

        if (!config.profiles.length) config.profiles.push(createProfile());
        if (!config.projects.length) config.projects.push(createProject());
        if (!config.defaultProfileId) config.defaultProfileId = config.profiles[0].id;
        if (!config.defaultProjectId) config.defaultProjectId = config.projects[0].id;
        return config;
      }

      function loadDb() {
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!raw) return { version: DEFAULT_VERSION, config: createDefaultConfig(), months: {} };
          const migrated = { version: DEFAULT_VERSION, config: normalizeConfig(raw.config || raw), months: raw.months || {} };
          if (!migrated.config.labels) migrated.config.labels = createDefaultLabels();
          migrated.config.version = DEFAULT_VERSION;
          if (!migrated.config.global) migrated.config.global = createDefaultConfig().global;
          if (!migrated.config.profiles || !migrated.config.profiles.length) migrated.config.profiles = [createProfile()];
          if (!migrated.config.projects || !migrated.config.projects.length) migrated.config.projects = [createProject()];
          return migrated;
        } catch (err) {
          return { version: DEFAULT_VERSION, config: createDefaultConfig(), months: {} };
        }
      }

      function saveDb() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      }

      function timeToMin(value) {
        if (!value || !/^\d{2}:\d{2}$/.test(value)) return null;
        const [hours, minutes] = value.split(":").map(Number);
        return hours * 60 + minutes;
      }

      function actionMinutes(action) {
        const start = timeToMin(action && action.from);
        const end = timeToMin(action && action.to);
        if (start === null || end === null) return 0;
        return end >= start ? end - start : (24 * 60 - start) + end;
      }

      function fmtMin(min) {
        const rounded = Math.max(0, Math.round(min));
        return `${Math.floor(rounded / 60)}:${pad(rounded % 60)} h`;
      }

      function normalizeResolution(value) {
        if (value === "30m") return "30m";
        if (value === "hour") return "hour";
        return DEFAULT_RESOLUTION;
      }

      function stepForResolution(resolution) {
        const value = normalizeResolution(resolution);
        if (value === "hour") return 3600;
        if (value === "30m") return 1800;
        return 60;
      }

      function roundTime(value, resolution) {
        if (!value || !/^\d{2}:\d{2}$/.test(value)) return value || "";
        const [hours, minutes] = value.split(":").map(Number);
        const total = (hours * 60) + minutes;
        const step = resolution === "hour" ? 60 : resolution === "30m" ? 30 : 1;
        const rounded = Math.max(0, Math.round(total / step) * step);
        const h = Math.floor(rounded / 60) % 24;
        const m = rounded % 60;
        return `${pad(h)}:${pad(m)}`;
      }

      function monthGrid(key) {
        const [year, month] = key.split("-").map(Number);
        const first = new Date(year, month - 1, 1);
        const last = new Date(year, month, 0);
        const mondayIndex = (first.getDay() + 6) % 7;
        const start = new Date(first);
        start.setDate(first.getDate() - mondayIndex);

        const sundayIndex = (last.getDay() + 6) % 7;
        const end = new Date(last);
        end.setDate(last.getDate() + (6 - sundayIndex));

        const days = [];
        for (let day = new Date(start); day <= end; day.setDate(day.getDate() + 1)) {
          days.push(new Date(day));
        }
        return days;
      }

      function getSelectedProfile() {
        return (db.config.profiles || []).find((profile) => profile.id === state.selectedProfileId) || db.config.profiles[0];
      }

      function getSelectedProject() {
        return (db.config.projects || []).find((project) => project.id === state.selectedProjectId) || db.config.projects[0];
      }

      function getEffectiveConfig() {
        const globalCfg = db.config.global || { timeResolution: DEFAULT_RESOLUTION, workFrom: DEFAULT_WORK_FROM, workTo: DEFAULT_WORK_TO, workTypes: clone(defaultWorkTypes()), dayFields: clone(defaultDayFields()) };
        const profileCfg = getSelectedProfile() ? (getSelectedProfile().config || {}) : {};
        const projectCfg = getSelectedProject() ? (getSelectedProject().config || {}) : {};

        const effective = {
          timeResolution: normalizeResolution(projectCfg.timeResolution || profileCfg.timeResolution || globalCfg.timeResolution || DEFAULT_RESOLUTION),
          workFrom: projectCfg.workFrom || profileCfg.workFrom || globalCfg.workFrom || DEFAULT_WORK_FROM,
          workTo: projectCfg.workTo || profileCfg.workTo || globalCfg.workTo || DEFAULT_WORK_TO,
          workTypes: projectCfg.workTypes && projectCfg.workTypes.length ? projectCfg.workTypes : (profileCfg.workTypes && profileCfg.workTypes.length ? profileCfg.workTypes : (globalCfg.workTypes || clone(defaultWorkTypes()))),
          dayFields: projectCfg.dayFields && projectCfg.dayFields.length ? projectCfg.dayFields : (profileCfg.dayFields && profileCfg.dayFields.length ? profileCfg.dayFields : (globalCfg.dayFields || clone(defaultDayFields())))
        };

        return effective;
      }

      function buildActionDefaults(workTypeId, workTypes) {
        const type = (workTypes || []).find((item) => item.id === workTypeId) || (workTypes || [])[0] || { defaultValues: { description: "", notes: "", attrs: {} }, attributes: [] };
        const defaults = type.defaultValues || { description: "", notes: "", attrs: {} };
        const attrs = {};
        (type.attributes || []).forEach((attr) => {
          attrs[attr.id] = ((defaults.attrs || {})[attr.id]) ?? (attr.defaultValue || "");
        });
        return {
          workType: type.id || "",
          from: "",
          to: "",
          description: defaults.description || "",
          notes: defaults.notes || "",
          attrs
        };
      }

      function getMonthBucket() {
        const monthKey = currentMonth;
        if (!db.months[monthKey]) db.months[monthKey] = {};
        if (!db.months[monthKey][state.selectedProfileId]) db.months[monthKey][state.selectedProfileId] = {};
        if (!db.months[monthKey][state.selectedProfileId][state.selectedProjectId]) {
          db.months[monthKey][state.selectedProfileId][state.selectedProjectId] = { days: {} };
        }
        return db.months[monthKey][state.selectedProfileId][state.selectedProjectId];
      }

      function ensureDay(date) {
        const bucket = getMonthBucket();
        const cfg = getEffectiveConfig();
        if (!bucket.days[date]) {
          bucket.days[date] = {
            workFrom: cfg.workFrom || DEFAULT_WORK_FROM,
            workTo: cfg.workTo || DEFAULT_WORK_TO,
            area: "",
            nextPlan: "",
            risks: "",
            notes: "",
            extra: {},
            actions: []
          };
        }
        if (!bucket.days[date].workFrom) bucket.days[date].workFrom = cfg.workFrom || DEFAULT_WORK_FROM;
        if (!bucket.days[date].workTo) bucket.days[date].workTo = cfg.workTo || DEFAULT_WORK_TO;
        const fields = cfg.dayFields || [];
        fields.forEach((field) => {
          if (!field || !field.id) return;
          if (["area", "nextPlan", "risks", "notes"].includes(field.id)) {
            if (bucket.days[date][field.id] === undefined) bucket.days[date][field.id] = field.defaultValue || "";
          } else if (bucket.days[date].extra[field.id] === undefined) {
            bucket.days[date].extra[field.id] = field.defaultValue || "";
          }
        });
        return bucket.days[date];
      }

      function getFieldValue(day, fieldId) {
        if (day && day.extra && Object.prototype.hasOwnProperty.call(day.extra, fieldId)) return day.extra[fieldId] || "";
        return day && day[fieldId] ? day[fieldId] : "";
      }

      function setDayField(day, fieldId, value) {
        if (["area", "nextPlan", "risks", "notes", "workFrom", "workTo"].includes(fieldId)) {
          day[fieldId] = value;
        } else {
          day.extra = day.extra || {};
          day.extra[fieldId] = value;
        }
      }

      function getLabels() {
        const defaultLabels = createDefaultLabels();
        return Object.assign({}, defaultLabels, (db.config && db.config.labels) || {});
      }

      function render() {
        if (state.configOpen) {
          renderConfigPage();
          return;
        }

        const labels = getLabels();
        const calendar = $("#calendar");
        calendar.className = "wrap weeks";
        calendar.innerHTML = "";

        const days = monthGrid(currentMonth);
        const [year, month] = currentMonth.split("-").map(Number);
        const names = ["Pon", "Wt", "Śr", "Czw", "Pt", "Sob", "Nd"];
        $("#appTitle").textContent = labels.title;
        $("#monthLabelText").textContent = labels.month;
        $("#profileLabelText").textContent = labels.profile;
        $("#projectLabelText").textContent = labels.project;
        $("#configBtn").textContent = labels.config;
        $("#exportBtn").textContent = labels.exportJson;
        $("#importLabelText").textContent = labels.importJson;
        $("#clearBtn").textContent = labels.clearMonth;
        const cfg = getEffectiveConfig();

        for (let i = 0; i < days.length; i += 7) {
          const week = document.createElement("section");
          week.className = "week";

          days.slice(i, i + 7).forEach((dateObj, idx) => {
            const inMonth = dateObj.getFullYear() === year && dateObj.getMonth() + 1 === month;
            const dateKey = iso(dateObj);
            const day = inMonth ? ensureDay(dateKey) : null;
            const total = inMonth ? (day.actions || []).reduce((sum, action) => sum + actionMinutes(action), 0) : 0;

            const article = document.createElement("article");
            article.className = "day" + (inMonth ? "" : " off");
            article.innerHTML = `
              <div class="day-head">
                <div class="day-title">${names[idx]} ${pad(dateObj.getDate())}.${pad(dateObj.getMonth() + 1)}</div>
                <div class="day-total">${fmtMin(total)}</div>
              </div>
              ${inMonth ? dayForm(dateKey, day, cfg) : '<div class="day-body small">Poza wybranym miesiącem</div>'}
            `;
            week.appendChild(article);
          });
          calendar.appendChild(week);
        }

        bindMainControls();
        updateStats();
      }

      function dayForm(dateKey, day, config) {

      function actionForm(index, action, config) {

      function bindMainControls() {
        document.querySelectorAll(".day-body[data-date]").forEach((dayEl) => {
          const dateKey = dayEl.dataset.date;

          dayEl.querySelectorAll("[data-field]").forEach((input) => {
            input.addEventListener("input", () => {
              const day = ensureDay(dateKey);
              const field = input.dataset.field;
              if (field === "workFrom" || field === "workTo") {
                const value = roundTime(input.value, getEffectiveConfig().timeResolution);
                input.value = value;
                day[field] = value;
              } else {
                setDayField(day, field, input.value);
              }
              saveDb();
            });
          });

          dayEl.querySelectorAll("[data-day-field]").forEach((input) => {
            input.addEventListener("input", () => {
              const day = ensureDay(dateKey);
              setDayField(day, input.dataset.dayField, input.value);
              saveDb();
            });
          });

          const addButton = dayEl.querySelector("[data-add-action]");
          if (addButton) {
            addButton.addEventListener("click", () => {
              const day = ensureDay(dateKey);
              const type = (getEffectiveConfig().workTypes || [])[0];
              const newAction = type ? buildActionDefaults(type.id, getEffectiveConfig().workTypes) : { workType: "", from: "", to: "", description: "", notes: "", attrs: {} };
              day.actions.push(newAction);
              saveDb();
              render();
            });
          }

          dayEl.querySelectorAll(".action").forEach((actionEl) => {
            const index = Number(actionEl.dataset.action);
            actionEl.querySelectorAll("[data-afield]").forEach((input) => {
              input.addEventListener("input", () => {
                const day = ensureDay(dateKey);
                const action = day.actions[index];
                const field = input.dataset.afield;

                if (field === "workType") {
                  action.workType = input.value;
                  const selectedType = (getEffectiveConfig().workTypes || []).find((item) => item.id === input.value);
                  if (selectedType) {
                    const defaults = buildActionDefaults(selectedType.id, getEffectiveConfig().workTypes);
                    action.description = defaults.description;
                    action.notes = defaults.notes;
                    action.attrs = defaults.attrs || {};
                    actionEl.querySelector('[data-afield="description"]').value = defaults.description;
                    actionEl.querySelector('[data-afield="notes"]').value = defaults.notes;
                  }
                } else if (field === "from" || field === "to") {
                  action[field] = roundTime(input.value, getEffectiveConfig().timeResolution);
                } else if (field === "description" || field === "notes") {
                  action[field] = input.value;
                } else if (field.startsWith("attrs.")) {
                  const attrId = field.replace("attrs.", "");
                  action.attrs = action.attrs || {};
                  action.attrs[attrId] = input.value;
                }

                const duration = actionEl.querySelector("[data-action-duration]");
                duration.textContent = fmtMin(actionMinutes(action));
                const totalMinutes = (day.actions || []).reduce((sum, item) => sum + actionMinutes(item), 0);
                dayEl.closest(".day").querySelector(".day-total").textContent = fmtMin(totalMinutes);
                saveDb();
                updateStats();
              });
            });

            const removeButton = actionEl.querySelector("[data-remove-action]");
            if (removeButton) {
              removeButton.addEventListener("click", () => {
                const day = ensureDay(dateKey);
                day.actions.splice(index, 1);
                saveDb();
                render();
              });
            }
          });
        });
      }

      function updateStats() {
        const bucket = getMonthBucket();
        let totalMinutes = 0;
        let count = 0;
        Object.values(bucket.days || {}).forEach((day) => {
          (day.actions || []).forEach((action) => {
            totalMinutes += actionMinutes(action);
            count += 1;
          });
        });

        $("#totalHours").textContent = fmtMin(totalMinutes);
        $("#remainingHours").textContent = fmtMin(Math.max(0, LIMIT_MIN - totalMinutes));
        $("#actionCount").textContent = String(count);
        const pct = Math.min(100, (totalMinutes / LIMIT_MIN) * 100);
        $("#progressBar").style.width = `${pct}%`;
        $("#limitBox").classList.toggle("limit-over", totalMinutes > LIMIT_MIN);
      }

              db.config.profiles = db.config.profiles.filter((item) => item.id !== profileId);
              if (db.config.defaultProfileId === profileId) db.config.defaultProfileId = db.config.profiles[0].id;
              if (state.selectedProfileId === profileId) state.selectedProfileId = db.config.profiles[0].id;
              saveDb();
              render();
            });
          }

          const addTypeBtn = card.querySelector("[data-add-work-type]");
          if (addTypeBtn) {
            addTypeBtn.addEventListener("click", () => {
              const type = { id: uid("worktype"), name: "Nowy typ", defaultValues: { description: "", notes: "", attrs: {} }, attributes: [] };
              profile.config.workTypes = profile.config.workTypes || [];
              profile.config.workTypes.push(type);
              saveDb();
              render();
            });
          }

          const addFieldBtn = card.querySelector("[data-add-day-field]");
          if (addFieldBtn) {
            addFieldBtn.addEventListener("click", () => {
              profile.config.dayFields = profile.config.dayFields || [];
              profile.config.dayFields.push({ id: uid("field"), label: "Nowe pole", type: "textarea", defaultValue: "" });
              saveDb();
              render();
            });
          }

          card.querySelectorAll("[data-work-type-id]").forEach((typeCard) => {
            const type = (profile.config.workTypes || []).find((item) => item.id === typeCard.dataset.workTypeId);
            if (!type) return;

            const typeNameInput = typeCard.querySelector("[data-work-type-name]");
            if (typeNameInput) {
              typeNameInput.addEventListener("input", () => {
                type.name = typeNameInput.value || "Nowy typ";
                saveDb();
              });
            }

            const defaultDescription = typeCard.querySelector("[data-default-description]");
            if (defaultDescription) {
              defaultDescription.addEventListener("input", () => {
                type.defaultValues = type.defaultValues || { description: "", notes: "", attrs: {} };
                type.defaultValues.description = defaultDescription.value;
                saveDb();
              });
            }

            const defaultNotes = typeCard.querySelector("[data-default-notes]");
            if (defaultNotes) {
              defaultNotes.addEventListener("input", () => {
                type.defaultValues = type.defaultValues || { description: "", notes: "", attrs: {} };
                type.defaultValues.notes = defaultNotes.value;
                saveDb();
              });
            }

            const addAttrButton = typeCard.querySelector("[data-add-attribute]");
            if (addAttrButton) {
              addAttrButton.addEventListener("click", () => {
                type.attributes = type.attributes || [];
                type.attributes.push({ id: uid("attr"), label: "Nowy atrybut", name: "Nowy atrybut", type: "textarea", defaultValue: "" });
                saveDb();
                render();
              });
            }

            const removeTypeButton = typeCard.querySelector("[data-remove-work-type]");
            if (removeTypeButton) {
              removeTypeButton.addEventListener("click", () => {
                profile.config.workTypes = (profile.config.workTypes || []).filter((item) => item.id !== type.id);
                saveDb();
                render();
              });
            }

            typeCard.querySelectorAll("[data-attribute-id]").forEach((attrCard) => {
              const attr = (type.attributes || []).find((item) => item.id === attrCard.dataset.attributeId);
              if (!attr) return;

              const nameInput = attrCard.querySelector("[data-attribute-name]");
              if (nameInput) {
                nameInput.addEventListener("input", () => {
                  attr.label = nameInput.value || "Nowy atrybut";
                  attr.name = nameInput.value || "Nowy atrybut";
                  saveDb();
                });
              }

              const defaultValueInput = attrCard.querySelector("[data-attribute-default]");
              if (defaultValueInput) {
                defaultValueInput.addEventListener("input", () => {
                  attr.defaultValue = defaultValueInput.value;
                  type.defaultValues = type.defaultValues || { description: "", notes: "", attrs: {} };
                  type.defaultValues.attrs = type.defaultValues.attrs || {};
                  type.defaultValues.attrs[attr.id] = defaultValueInput.value;
                  saveDb();
                });
              }

              const removeButton = attrCard.querySelector("[data-remove-attribute]");
              if (removeButton) {
                removeButton.addEventListener("click", () => {
                  type.attributes = (type.attributes || []).filter((item) => item.id !== attr.id);
                  if (type.defaultValues && type.defaultValues.attrs) delete type.defaultValues.attrs[attr.id];
                  saveDb();
                  render();
                });
              }
            });
          });

          card.querySelectorAll("[data-day-field-id]").forEach((fieldCard) => {
            const field = (profile.config.dayFields || []).find((item) => item.id === fieldCard.dataset.dayFieldId);
            if (!field) return;

            const nameInput = fieldCard.querySelector("[data-day-field-label]");
            if (nameInput) {
              nameInput.addEventListener("input", () => {
                field.label = nameInput.value || "Nowe pole";
                saveDb();
              });
            }

            const removeButton = fieldCard.querySelector("[data-remove-day-field]");
            if (removeButton) {
              removeButton.addEventListener("click", () => {
                profile.config.dayFields = (profile.config.dayFields || []).filter((item) => item.id !== field.id);
                saveDb();
                render();
              });
            }
          });
        });

        document.querySelectorAll("[data-project-id]").forEach((card) => {
          const projectId = card.dataset.projectId;
          const project = (db.config.projects || []).find((item) => item.id === projectId);
          if (!project) return;

          const nameInput = card.querySelector("[data-project-name]");
          if (nameInput) {
            nameInput.addEventListener("input", () => {
              project.name = nameInput.value || "Nowy projekt";
              saveDb();
            });
          }

          const resolutionInput = card.querySelector("[data-project-resolution]");
          if (resolutionInput) {
            resolutionInput.addEventListener("change", () => {
              project.config.timeResolution = normalizeResolution(resolutionInput.value);
              const fromInput = card.querySelector("[data-project-work-from]");
              const toInput = card.querySelector("[data-project-work-to]");
              if (fromInput) fromInput.step = stepForResolution(project.config.timeResolution);
              if (toInput) toInput.step = stepForResolution(project.config.timeResolution);
              if (fromInput) fromInput.value = roundTime(fromInput.value || project.config.workFrom || DEFAULT_WORK_FROM, project.config.timeResolution);
              if (toInput) toInput.value = roundTime(toInput.value || project.config.workTo || DEFAULT_WORK_TO, project.config.timeResolution);
              project.config.workFrom = fromInput ? fromInput.value : (project.config.workFrom || DEFAULT_WORK_FROM);
              project.config.workTo = toInput ? toInput.value : (project.config.workTo || DEFAULT_WORK_TO);
              saveDb();
            });
          }

          const workFromInput = card.querySelector("[data-project-work-from]");
          if (workFromInput) {
            workFromInput.addEventListener("input", () => {
              const value = roundTime(workFromInput.value, project.config.timeResolution || DEFAULT_RESOLUTION);
              workFromInput.value = value;
              project.config.workFrom = value || DEFAULT_WORK_FROM;
              saveDb();
            });
          }

          const workToInput = card.querySelector("[data-project-work-to]");
          if (workToInput) {
            workToInput.addEventListener("input", () => {
              const value = roundTime(workToInput.value, project.config.timeResolution || DEFAULT_RESOLUTION);
              workToInput.value = value;
              project.config.workTo = value || DEFAULT_WORK_TO;
              saveDb();
            });
          }

          const removeButton = card.querySelector("[data-remove-project]");
          if (removeButton) {
            removeButton.addEventListener("click", () => {
              if ((db.config.projects || []).length <= 1) return;
              db.config.projects = db.config.projects.filter((item) => item.id !== projectId);
              if (db.config.defaultProjectId === projectId) db.config.defaultProjectId = db.config.projects[0].id;
              if (state.selectedProjectId === projectId) state.selectedProjectId = db.config.projects[0].id;
              saveDb();
              render();
            });
          }

          const addTypeBtn = card.querySelector("[data-add-work-type]");
          if (addTypeBtn) {
            addTypeBtn.addEventListener("click", () => {
              project.config.workTypes = project.config.workTypes || [];
              project.config.workTypes.push({ id: uid("worktype"), name: "Nowy typ", defaultValues: { description: "", notes: "", attrs: {} }, attributes: [] });
              saveDb();
              render();
            });
          }

          const addFieldBtn = card.querySelector("[data-add-day-field]");
          if (addFieldBtn) {
            addFieldBtn.addEventListener("click", () => {
              project.config.dayFields = project.config.dayFields || [];
              project.config.dayFields.push({ id: uid("field"), label: "Nowe pole", type: "textarea", defaultValue: "" });
              saveDb();
              render();
            });
          }

          card.querySelectorAll("[data-work-type-id]").forEach((typeCard) => {
            const type = (project.config.workTypes || []).find((item) => item.id === typeCard.dataset.workTypeId);
            if (!type) return;

            const typeNameInput = typeCard.querySelector("[data-work-type-name]");
            if (typeNameInput) {
              typeNameInput.addEventListener("input", () => {
                type.name = typeNameInput.value || "Nowy typ";
                saveDb();
              });
            }

            const defaultDescription = typeCard.querySelector("[data-default-description]");
            if (defaultDescription) {
              defaultDescription.addEventListener("input", () => {
                type.defaultValues = type.defaultValues || { description: "", notes: "", attrs: {} };
                type.defaultValues.description = defaultDescription.value;
                saveDb();
              });
            }

            const defaultNotes = typeCard.querySelector("[data-default-notes]");
            if (defaultNotes) {
              defaultNotes.addEventListener("input", () => {
                type.defaultValues = type.defaultValues || { description: "", notes: "", attrs: {} };
                type.defaultValues.notes = defaultNotes.value;
                saveDb();
              });
            }

            const addAttrButton = typeCard.querySelector("[data-add-attribute]");
            if (addAttrButton) {
              addAttrButton.addEventListener("click", () => {
                type.attributes = type.attributes || [];
                type.attributes.push({ id: uid("attr"), label: "Nowy atrybut", name: "Nowy atrybut", type: "textarea", defaultValue: "" });
                saveDb();
                render();
              });
            }

            const removeTypeButton = typeCard.querySelector("[data-remove-work-type]");
            if (removeTypeButton) {
              removeTypeButton.addEventListener("click", () => {
                project.config.workTypes = (project.config.workTypes || []).filter((item) => item.id !== type.id);
                saveDb();
                render();
              });
            }

            typeCard.querySelectorAll("[data-attribute-id]").forEach((attrCard) => {
              const attr = (type.attributes || []).find((item) => item.id === attrCard.dataset.attributeId);
              if (!attr) return;

              const nameInput = attrCard.querySelector("[data-attribute-name]");
              if (nameInput) {
                nameInput.addEventListener("input", () => {
                  attr.label = nameInput.value || "Nowy atrybut";
                  attr.name = nameInput.value || "Nowy atrybut";
                  saveDb();
                });
              }

              const defaultValueInput = attrCard.querySelector("[data-attribute-default]");
              if (defaultValueInput) {
                defaultValueInput.addEventListener("input", () => {
                  attr.defaultValue = defaultValueInput.value;
                  type.defaultValues = type.defaultValues || { description: "", notes: "", attrs: {} };
                  type.defaultValues.attrs = type.defaultValues.attrs || {};
                  type.defaultValues.attrs[attr.id] = defaultValueInput.value;
                  saveDb();
                });
              }

              const removeButton = attrCard.querySelector("[data-remove-attribute]");
              if (removeButton) {
                removeButton.addEventListener("click", () => {
                  type.attributes = (type.attributes || []).filter((item) => item.id !== attr.id);
                  if (type.defaultValues && type.defaultValues.attrs) delete type.defaultValues.attrs[attr.id];
                  saveDb();
                  render();
                });
              }
            });
          });

          card.querySelectorAll("[data-day-field-id]").forEach((fieldCard) => {
            const field = (project.config.dayFields || []).find((item) => item.id === fieldCard.dataset.dayFieldId);
            if (!field) return;

            const nameInput = fieldCard.querySelector("[data-day-field-label]");
            if (nameInput) {
              nameInput.addEventListener("input", () => {
                field.label = nameInput.value || "Nowe pole";
                saveDb();
              });
            }

            const removeButton = fieldCard.querySelector("[data-remove-day-field]");
            if (removeButton) {
              removeButton.addEventListener("click", () => {
                project.config.dayFields = (project.config.dayFields || []).filter((item) => item.id !== field.id);
                saveDb();
                render();
              });
            }
          });
        });
      }

      const state = {
        selectedProfileId: null,
        selectedProjectId: null,
        configOpen: false
      };

      let currentMonth = ym(new Date());
      let db = loadDb();

      function initializeSelectors() {
        const profileSelect = $("#profileSelect");
        const projectSelect = $("#projectSelect");
        const config = db.config || createDefaultConfig();
        const labels = getLabels();
        state.selectedProfileId = config.defaultProfileId || (config.profiles[0] && config.profiles[0].id) || null;
        state.selectedProjectId = config.defaultProjectId || (config.projects[0] && config.projects[0].id) || null;
        if (document.querySelector("#appTitle")) document.querySelector("#appTitle").textContent = labels.title;
        if (document.querySelector("#monthLabelText")) document.querySelector("#monthLabelText").textContent = labels.month;
        if (document.querySelector("#profileLabelText")) document.querySelector("#profileLabelText").textContent = labels.profile;
        if (document.querySelector("#projectLabelText")) document.querySelector("#projectLabelText").textContent = labels.project;
        if (document.querySelector("#configBtn")) document.querySelector("#configBtn").textContent = labels.config;
        if (document.querySelector("#exportBtn")) document.querySelector("#exportBtn").textContent = labels.exportJson;
        if (document.querySelector("#importLabelText")) document.querySelector("#importLabelText").textContent = labels.importJson;
        if (document.querySelector("#clearBtn")) document.querySelector("#clearBtn").textContent = labels.clearMonth;

        if (profileSelect) {
          profileSelect.innerHTML = (config.profiles || []).map((profile) => `
            <option value="${profile.id}" ${profile.id === state.selectedProfileId ? "selected" : ""}>${esc(profile.name)}</option>
          `).join("");
          profileSelect.value = state.selectedProfileId;
          profileSelect.addEventListener("change", (event) => {
            state.selectedProfileId = event.target.value;
            db.config.defaultProfileId = event.target.value;
            saveDb();
            render();
          });
        }

        if (projectSelect) {
          projectSelect.innerHTML = (config.projects || []).map((project) => `
            <option value="${project.id}" ${project.id === state.selectedProjectId ? "selected" : ""}>${esc(project.name)}</option>
          `).join("");
          projectSelect.value = state.selectedProjectId;
          projectSelect.addEventListener("change", (event) => {
            state.selectedProjectId = event.target.value;
            db.config.defaultProjectId = event.target.value;
            saveDb();
            render();
          });
        }

        $("#configBtn").addEventListener("click", () => {
          state.configOpen = true;
          render();
        });
      }

      $("#monthPicker").addEventListener("change", (event) => {
        currentMonth = event.target.value || currentMonth;
        render();
      });

      $("#exportBtn").addEventListener("click", () => {
        saveDb();
        const payload = {
          app: "Ewidencja działań projektowych",
          version: DEFAULT_VERSION,
          exportedAt: new Date().toISOString(),
          data: db
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `ewidencja-${currentMonth}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
      });

      $("#importInput").addEventListener("change", async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          const incoming = parsed && parsed.data ? parsed.data : parsed;
          if (!incoming || typeof incoming !== "object" || !incoming.months) {
            throw new Error("Nieprawidłowy format pliku");
          }
          db = {
            version: DEFAULT_VERSION,
            config: normalizeConfig(incoming.config || incoming),
            months: incoming.months || {}
          };
          saveDb();
          initializeSelectors();
          render();
          alert("Import zakończony.");
        } catch (err) {
          alert("Nie udało się wczytać pliku JSON: " + err.message);
        } finally {
          event.target.value = "";
        }
      });

      $("#clearBtn").addEventListener("click", () => {
        const monthBucket = db.months[currentMonth] || {};
        if (!monthBucket || !monthBucket[state.selectedProfileId] || !monthBucket[state.selectedProfileId][state.selectedProjectId]) {
          return;
        }
        if (confirm(`Usunąć wszystkie dane dla ${currentMonth}?`)) {
          delete monthBucket[state.selectedProfileId][state.selectedProjectId];
          saveDb();
          render();
        }
      });

      $("#monthPicker").value = currentMonth;
      initializeSelectors();
      render();
    })();
  </script>
</body>
</html>
